# 安心用药 · 生产形态：api（多阶段镜像，托管 web/dist + /api，8787）+ db + caddy
# 本地开发仅起 db：docker compose up -d db
# 生产部署（火山 ECS）：见 deploy/README.md —— 先 `cp deploy/.env.example .env` 填真实值，再 docker compose up -d --build
# 密钥口径：api 的运行期凭据由 env_file 读本目录 .env 注入（缺文件不报错，缺键即保持未定义）；
# .env 不入 git、不进镜像（.gitignore / .dockerignore 均已排除）。构建参数 NPM_REGISTRY 走 compose 插值，同样读这个文件。

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: anxin-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
    # 凭据与可调项走 env_file：文件里没有的键就保持「未定义」，api 代码据此回落内置默认模型。
    # 不用 ${VAR} 插值——compose 对缺失变量注入的是空字符串，而代码里 QWEN_MODEL/BAICHUAN_MODEL 等
    # 用 ?? 取默认值，空串 ≠ 未定义，会把模型名变成空串导致调用失败。
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8787"
      # 指向 compose 内的 db 服务；口令与 db 服务同源（deploy/.env.example 的 POSTGRES_PASSWORD）。
      # environment 优先级高于 env_file，故 .env 里那条指向宿主 localhost 的 DATABASE_URL 不会漏进来。
      DATABASE_URL: postgres://anxin:${POSTGRES_PASSWORD:-anxin_dev_2026}@db:5432/anxin_medication

  db:
    image: postgres:18-alpine
    container_name: anxin-db
    restart: unless-stopped
    ports:
      # 数据库不进公网：仅绑宿主机回环（供 SSH 隧道 / 本机 pg_dump 恢复用），安全组也不要放行 5432
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: anxin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anxin_dev_2026}
      POSTGRES_DB: anxin_medication
    volumes:
      # PG18 镜像 PGDATA 默认 /var/lib/postgresql/18/docker（挂载点须为父目录，否则数据不随卷持久化）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anxin -d anxin_medication"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # 过渡期（未备案）只占位、不承担流量：公网入口是裸 IP http://<IP>:8787 直连 api。
  # 备案下来后换 deploy/Caddyfile 的 HTTPS 版本（见 Caddyfile.https.example），届时才真正接 80/443。
  caddy:
    image: caddy:2-alpine
    container_name: anxin-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
