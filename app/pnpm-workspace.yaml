packages:
  - 'packages/*'
  - 'e2e'

# RN/Expo monorepo 必须扁平布局（npm 同款）：隔离布局下 babel 转译器解析不到传递依赖、
# C++ 编译超 Windows 260 字符路径上限（.pnpm 超长哈希目录）。Expo 官方建议 node-linker=hoisted。
nodeLinker: hoisted

# pnpm 10+ 默认拦截依赖的构建脚本；esbuild（vite / tsx 的底层）需显式放行才能装好平台二进制。
# 注意：pnpm 11 起该设置从 package.json 的 "pnpm" 字段迁到此处（pnpm-workspace.yaml）。
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true

# M5-T3 补修（随 M5-T2 验证发现）：hoisted 布局下 mobile 精确钉 react 19.2.3、web 的 ^19.0.0
# 解析成 19.2.8，两份 React 并存 → @tanstack/react-query 取到副本 React，hooks dispatcher 为 null，
# web 渲染类测试 82 例全炸（错误签名 Cannot read properties of null (reading 'useEffect')）。
# 统一钉到 Expo SDK 57 要求的 19.2.3：单一副本，mobile 版本不变。
overrides:
  react: 19.2.3
  react-dom: 19.2.3
