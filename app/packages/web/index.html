<!doctype html>
<html lang="zh-CN" data-scale="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安心用药</title>
    <!-- 图标：真相源 app/icons/anxin_icon.png，派生见 app/icons/README.md（public/ 下同名文件）。 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#25695b" />
    <meta name="application-name" content="安心用药" />
    <meta name="apple-mobile-web-app-title" content="安心用药" />
    <script>
      // 首屏前应用已持久化的字号档，避免大字用户刷新时闪烁（zustand persist: anxin-font-scale）。
      try {
        var s = JSON.parse(localStorage.getItem('anxin-font-scale') || '{}')
        var scale = (s && s.state && s.state.scale) || 'normal'
        document.documentElement.setAttribute('data-scale', scale)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
